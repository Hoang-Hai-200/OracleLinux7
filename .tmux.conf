
set -g default-terminal "xterm-256color"                                             
set -ga terminal-overrides ",xterm-256color:Tc"                                      
unbind C-b                                                                           
set-option -g prefix C-a                                                             
set-option -g repeat-time 300                                                        
set-option -g default-terminal "screen-256color"                                     
set-window-option -g mode-keys vi                                                    
bind r source-file ~/.tmux.conf \; display "Reloaded!"                               
bind o run-shell "open #{pane_current_path}"                                         
bind -r e kill-pane -a                                                               
bind -n M-k select-pane -U                                                           
bind -n M-j select-pane -D                                                           
bind -n M-h select-pane -L                                                           
bind -n M-l select-pane -R                                                           
bind-key -n C-S-Left swap-window -t -1 \; previous-window                            
bind-key -n C-S-Right swap-window -t +1 \; next-window                               
bind \ split-window -h                                                               
bind - split-window -v                                                               
unbind '"'                                                                           
unbind %                                                                             
bind -n S-Left  previous-window                                                      
bind -n S-Right next-window                                                          
bind -r k resize-pane -U 5                                                           
bind -r j resize-pane -D 5                                                           
bind -r h resize-pane -L 5                                                           
bind -r l resize-pane -R 5                                                           
set -g base-index 1                                                                  
set -g pane-base-index 1                                                             
bind C-s setw synchronize-panes                                                      
set-option -ag status-right '#{?pane_synchronized, #[bg=colour208]  #[default],}'    
set-option -g status-justify "left"                                                  
set-window-option -g mode-keys vi                                                    
set-option -g status-fg cyan                                                         
set-option -g status-bg black                                                        
set-option -g history-limit 64096                                                    
set -sg escape-time 0                                                                
set -g status-bg colour238                                                           
set -g status-fg colour250                                                           
set-option -g status-utf8 on                                                         
set -g status-justify left                                                           
set-option -g status-position bottom                                                 
#set -g status-left '                                                                
set -g status-left-length 30                                                         
set -g status-left '#[bg=colour236,fg=colour33] #H:#S #[bg=default] '                
set-window-option -g window-status-format   '#[bg=colour238]#[fg=colour248] #I  '    
set-window-option -g window-status-current-format '#[bg=colour214,fg=colour239] #I '   
set -g status-right '#[bg=colour238]#[fg=colour248] %Y-%m-%d %H:%M '                 
set-option -g display-panes-active-colour colour33 #blue                             
set-option -g display-panes-colour colour166 #orange                                 
set-window-option -g clock-mode-colour colour64 #green                               
set -g set-titles on                                                                 
set -g set-titles-string "#T"           

